<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TabBar 图标预览 — 线条风格</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: #F5F6FA; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .phone-frame {
    width: 375px; height: 667px; background: #fff;
    border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,.12);
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .status-bar {
    height: 44px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 6px; font-size: 14px; font-weight: 600;
  }
  .content {
    flex:1; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color:#333; letter-spacing: 2px;
    background: linear-gradient(180deg,#f0f4ff 0%,#fff 50%);
  }
  .tabbar {
    height: 56px; background: #fff;
    border-top: 1px solid #eee;
    display: flex; align-items: stretch;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item {
    flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; transition: opacity .15s;
  }
  .tab-item:hover { opacity:.7; }
  .tab-item.active { /* active state simulation */ }
  .tab-icon { width: 26px; height: 26px; object-fit: contain; }
  .tab-label { font-size: 10px; line-height: 1; transition: color .15s; }
  .tab-item .tab-label { color: #9CA3AF; }
  .tab-item.active .tab-label { color: #0EA5E9; font-weight:600; }

  /* Grid view of all icons */
  .grid-section { margin-top: 40px; text-align:center; }
  h2 { margin-bottom:20px; font-size:16px; color:#555; }
  .icon-grid {
    display:inline-grid; grid-template-columns: repeat(4,1fr); gap:24px;
    background:#fff; padding:32px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.06);
  }
  .icon-cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .icon-cell img { width:48px; height:48px; object-fit:contain; }
  .icon-cell span { font-size:11px; color:#888; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar"><span>22:11</span><span><span>●●●●○</span></span></div>
  <div class="content">潜水船宿</div>
  <div class="tabbar">
    <div class="tab-item" data-name="home" onclick="setActive(this)">
      <img class="tab-icon" src="home.png" alt="">
      <span class="tab-label">首页</span>
    </div>
    <div class="tab-item active" data-name="search" onclick="setActive(this)">
      <img class="tab-icon" src="search-active.png" alt="">
      <span class="tab-label">搜索</span>
    </div>
    <div class="tab-item" data-name="ticket" onclick="setActive(this)">
      <img class="tab-icon" src="ticket.png" alt="">
      <span class="tab-label">早鸟团</span>
    </div>
    <div class="tab-item" data-name="user" onclick="setActive(this)">
      <img class="tab-icon" src="user.png" alt="">
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>

<script>
const iconMap = {
  home:   ['home.png','home-active.png'],
  search: ['search.png','search-active.png'],
  ticket: ['ticket.png','ticket-active.png'],
  user:   ['user.png','user-active.png']
};
function setActive(el){
  document.querySelectorAll('.tab-item').forEach(t=>{
    t.classList.remove('active');
    t.querySelector('.tab-label').style.color='#9CA3AF';
    const name = t.dataset.name;
    t.querySelector('.tab-icon').src = iconMap[name][0];
  });
  el.classList.add('active');
  el.querySelector('.tab-label').style.color='#0EA5E9';
  const name = el.dataset.name;
  el.querySelector('.tab-icon').src = iconMap[name][1];
}
</script>
</body>
</html>
